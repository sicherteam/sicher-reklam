name: LSA Lead API Sync Automation

on:
  schedule:
    # Her 10 dakikada bir 7/24 otomatik senkronizasyon
    - cron: '*/10 * * * *'
  workflow_dispatch: # Anlık tetikleme (Gmail Apps Script veya manuel)

permissions:
  contents: write

concurrency:
  group: scraper-group
  cancel-in-progress: false

jobs:
  sync-leads:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Çek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore Playwright Session Cache
        uses: actions/cache@v4
        with:
          path: session-state.json
          key: playwright-session-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            playwright-session-${{ runner.os }}-

      - name: Initialize Session from Secret if Missing
        env:
          GOOGLE_SESSION_STATE: ${{ secrets.GOOGLE_SESSION_STATE }}
        run: |
          if [ ! -f session-state.json ] || [ ! -s session-state.json ]; then
            if [ -n "$GOOGLE_SESSION_STATE" ]; then
              echo "Restoring session-state.json from GOOGLE_SESSION_STATE secret..."
              echo "$GOOGLE_SESSION_STATE" > session-state.json
            fi
          fi

      - name: Install Google Chrome, Xvfb & Playwright
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          npm install playwright
          npx playwright install --with-deps chrome

      - name: Run LSA Web Scraper (Standort & 2FA Login)
        continue-on-error: true
        env:
          GOOGLE_EMAIL: ${{ secrets.GOOGLE_EMAIL || 'atsicherteam@gmail.com' }}
          GOOGLE_PASSWORD: ${{ secrets.GOOGLE_PASSWORD }}
          GOOGLE_2FA_SECRET: ${{ secrets.GOOGLE_2FA_SECRET || '5gzwaIwsz2ehseiz2hjbdokz23rwmsan' }}
          LSA_INBOX_URL: ${{ secrets.LSA_INBOX_URL || 'https://ads.google.com/localservices/inbox?cid=9203255169&bid=11049534709&pid=9999999999&euid=8501543550&hl=de&gl=AT' }}
          GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID || '3226096935' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
          PROJECT_NAME: ${{ secrets.PROJECT_NAME || 'Sicher Reklam' }}
          DATA_PATH: 'data.json'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" node scraper-lsa-web.js

      - name: Upload Screenshot on Error
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-debug
          path: "*.png"
          if-no-files-found: ignore

      - name: Google Ads API Senkronizasyonunu Çalıştır
        continue-on-error: true
        env:
          GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID || '3226096935' }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
          PROJECT_NAME: ${{ secrets.PROJECT_NAME || 'Sicher Reklam' }}
          SKIP_TELEGRAM: ${{ secrets.SKIP_TELEGRAM || 'false' }}
          LOOKBACK_DAYS: '120'
          DATA_PATH: 'data.json'
        run: node scraper-api.js

      - name: Değişiklikleri Repoya Commit Et
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add data.json standort-cache.json
          
          if git diff --staged --quiet; then
            echo "✅ Veriler güncel, commit atlanıyor."
            exit 0
          fi
          
          git commit -m "Automated LSA lead sync with location [skip ci]"
          git pull --rebase --autostash -X theirs origin main
          git push origin main
